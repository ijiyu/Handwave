<!DOCTYPE html>
<html>
    <head>
        <title>HandWave Demo - Web Version</title>
        <link rel="stylesheet" href = "stylesheet.css">
        <link rel="icon" type="image/png" href="/logo_V1.png">
        <script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
                    "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
                }
			}
		</script>
    </head> 
    <div id = "container">
        <div class= "screen" id = "home-screen">
            <h1 style = "font-weight: bold;">Hand Wave Game</h1>
            <button id="start-button">Start!</button>
        </div>
        <div class = "screen" id = "game-screen">
            <h1 id="score" style="visibility: hidden;">Score: 0</h1>
            <video width = "100%" height = "100%" autoplay="true" id="camera-view" playsinline></video>
            <audio id ="song">
                <source src="BeethovenVirus.mp3" type="audio/mpeg">
            </audio>
        </div>
        <div id="blackOverlay" style = "position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0); display: block; z-index: 11;transition: background-color 0.6s ease; pointer-events: none;">

        </div>
    </div>
    
    <script type = "module" src = "game.js"></script>
    <script type = "module" src = "hand-track.js"></script>
</html>
